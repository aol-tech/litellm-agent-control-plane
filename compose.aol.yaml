# Override da AOL Tech: docker compose -f compose.yaml -f compose.aol.yaml up -d
# - UI/API em 127.0.0.1:4300 (a 4000 do host fica livre; na aol-net o LiteLLM é litellm:4000)
# - config.yaml local montado (modelos via aol-ops), segredos no .env (não versionados)
# - rede aol-net para alcançar o LiteLLM do aol-ops e o túnel cloudflared
services:
  lap:
    ports: !override
      - "127.0.0.1:4300:4000"
    env_file: .env
    environment:
      LITELLM_CONFIG: /app/config.yaml
      DATABASE_URL: postgres://lap:lap@lap-postgres:5432/litellm_agents
      LAP_PUBLIC_URL: ${LAP_PUBLIC_URL:-https://lap.aoltech.co}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    networks:
      aol-net: {aliases: [lap-web]}
    mem_limit: 1g
    restart: unless-stopped
  postgres:
    # só na aol-net: o Docker Desktop está sem pool de endereços para redes novas
    networks:
      aol-net: {aliases: [lap-postgres]}
    mem_limit: 512m
    restart: unless-stopped

  # runtime Hermes (motor dos agentes): os modelos voltam pelo LAP → aol-ops, então custo e traces ficam lá.
  # Busca web gratuita via DuckDuckGo (ddgs, sem chave).
  hermes:
    build:
      context: ./templates/hermes
      # imagem oficial do Hermes (a mesma do hermes-lab): o template do LAP faz `pip install .` do
      # hermes-agent, que o upstream passou a recusar ("Building wheels … not supported")
      dockerfile_inline: |
        FROM nousresearch/hermes-agent:v2026.9.24
        USER root
        RUN uv pip install --python /opt/hermes/.venv/bin/python "ddgs==9.16.0"
        WORKDIR /app
        COPY src ./src
        RUN mkdir -p /data /tmp/hermes-workspace
        ENV PORT=8080 DB_PATH=/data/agents.db HERMES_HOME_ROOT=/data/hermes-home \
            HERMES_WORKDIR=/tmp/hermes-workspace HERMES_COMMAND=/opt/hermes/.venv/bin/hermes
        EXPOSE 8080
        ENTRYPOINT []
        CMD ["sh", "-c", "python -m uvicorn src.server:app --host 0.0.0.0 --port 8080"]
    image: lap-hermes-aol
    environment:
      DEFAULT_MODEL: haiku-5.5
      RUNTIME_API_KEY: ${HERMES_RUNTIME_API_KEY}
      LAP_BASE_URL: http://lap-web:4000
      LAP_API_KEY: ${LITELLM_MASTER_KEY}
      HERMES_TOOLSETS: web,terminal
      HERMES_MAX_TURNS: "12"
    networks:
      aol-net: {aliases: [lap-hermes]}
    mem_limit: 1g
    restart: unless-stopped
  register-hermes:
    environment:
      LAP_URL: http://lap-web:4000
      LAP_MASTER_KEY: ${LITELLM_MASTER_KEY}
      RUNTIME_ALIAS: aol-hermes
      RUNTIME_API_SPEC: claude_managed_agents
      RUNTIME_API_BASE: http://lap-hermes:8080
      RUNTIME_API_KEY: ${HERMES_RUNTIME_API_KEY}
    networks: [aol-net]

  # runtime OpenCode (harness de código/agente geral) com Gemini 3.8 Flash. O OpenCode fala o formato OpenAI
  # (/chat/completions), que o LAP não expõe: aponta direto para o LiteLLM do aol-ops com a key `lap`
  # (custo e traces continuam no aol-ops/Langfuse).
  opencode:
    profiles: ["opencode"]
    build: ./templates/opencode
    environment:
      LITELLM_BASE_URL: http://litellm:4000/v1
      LITELLM_API_KEY: ${AOL_LITELLM_KEY}
      LITELLM_PROVIDER_ID: openai
      LITELLM_MODELS: gemini-3.8-flash,haiku-5.5,gpt-6-luna
      LITELLM_DEFAULT_MODEL: openai/gemini-3.8-flash
    volumes:
      - opencode-data:/data
      - opencode-workspace:/tmp/opencode-workspace
    networks:
      aol-net: {aliases: [lap-opencode]}
    mem_limit: 1536m
    restart: unless-stopped
  register-opencode:
    environment:
      LAP_URL: http://lap-web:4000
      LAP_MASTER_KEY: ${LITELLM_MASTER_KEY}
      RUNTIME_ALIAS: aol-opencode
      RUNTIME_API_SPEC: claude_managed_agents
      RUNTIME_API_BASE: http://lap-opencode:8080
      RUNTIME_API_KEY: opencode-local
    networks: [aol-net]

  # lap.aoltech.co → lap:4000 (túnel nomeado na conta Cloudflare da AOL Tech; credencial não versionada)
  tunnel:
    image: cloudflare/cloudflared:2025.8.1
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./aol/tunnel:/etc/cloudflared:ro
    depends_on: [lap]
    networks: [aol-net]
    restart: unless-stopped
    mem_limit: 128m

volumes:
  opencode-workspace:

networks:
  aol-net:
    external: true
