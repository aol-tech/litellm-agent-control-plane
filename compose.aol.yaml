# Override da AOL Tech: docker compose -f compose.yaml -f compose.aol.yaml up -d
# - UI/API em 127.0.0.1:4300 (a 4000 do host fica livre; na aol-net o LiteLLM é litellm:4000)
# - config.yaml local montado (modelos via aol-ops), segredos no .env (não versionados)
# - rede aol-net para alcançar o LiteLLM do aol-ops e o túnel cloudflared
services:
  lap:
    ports: !override
      - "127.0.0.1:4300:4000"
    env_file: .env
    environment:
      LITELLM_CONFIG: /app/config.yaml
      DATABASE_URL: postgres://lap:lap@lap-postgres:5432/litellm_agents
      LAP_PUBLIC_URL: ${LAP_PUBLIC_URL:-https://lap.aoltech.co}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    networks:
      aol-net: {aliases: [lap-web]}
    mem_limit: 1g
    restart: unless-stopped
  postgres:
    # só na aol-net: o Docker Desktop está sem pool de endereços para redes novas
    networks:
      aol-net: {aliases: [lap-postgres]}
    mem_limit: 512m
    restart: unless-stopped

  # runtime Hermes (motor dos agentes): os modelos voltam pelo LAP → aol-ops, então custo e traces ficam lá.
  # Busca web gratuita via DuckDuckGo (ddgs, sem chave).
  hermes:
    build:
      context: ./templates/hermes
      # imagem oficial do Hermes (a mesma do hermes-lab): o template do LAP faz `pip install .` do
      # hermes-agent, que o upstream passou a recusar ("Building wheels … not supported")
      dockerfile_inline: |
        FROM nousresearch/hermes-agent:v2026.9.24
        USER root
        RUN uv pip install --python /opt/hermes/.venv/bin/python "ddgs==9.16.0"
        WORKDIR /app
        COPY src ./src
        RUN mkdir -p /data /tmp/hermes-workspace
        ENV PORT=8080 DB_PATH=/data/agents.db HERMES_HOME_ROOT=/data/hermes-home \
            HERMES_WORKDIR=/tmp/hermes-workspace HERMES_COMMAND=/opt/hermes/.venv/bin/hermes
        EXPOSE 8080
        ENTRYPOINT []
        CMD ["sh", "-c", "python -m uvicorn src.server:app --host 0.0.0.0 --port 8080"]
    image: lap-hermes-aol
    environment:
      DEFAULT_MODEL: haiku-5.5
      RUNTIME_API_KEY: ${HERMES_RUNTIME_API_KEY}
      LAP_BASE_URL: http://lap-web:4000
      LAP_API_KEY: ${LITELLM_MASTER_KEY}
      HERMES_TOOLSETS: web,terminal
      HERMES_MAX_TURNS: "12"
    networks:
      aol-net: {aliases: [lap-hermes]}
    mem_limit: 1g
    restart: unless-stopped
  register-hermes:
    environment:
      LAP_URL: http://lap-web:4000
      LAP_MASTER_KEY: ${LITELLM_MASTER_KEY}
      RUNTIME_ALIAS: aol-hermes
      RUNTIME_API_SPEC: claude_managed_agents
      RUNTIME_API_BASE: http://lap-hermes:8080
      RUNTIME_API_KEY: ${HERMES_RUNTIME_API_KEY}
    networks: [aol-net]

  # runtime OpenCode (harness de código/agente geral) com Gemini 3.8 Flash. O OpenCode fala o formato OpenAI
  # (/chat/completions), que o LAP não expõe: aponta direto para o LiteLLM do aol-ops com a key `lap`
  # (custo e traces continuam no aol-ops/Langfuse).
  opencode:
    profiles: ["opencode"]
    build: ./templates/opencode
    environment:
      LITELLM_BASE_URL: http://litellm:4000/v1
      LITELLM_API_KEY: ${AOL_LITELLM_KEY}
      LITELLM_PROVIDER_ID: openai
      LITELLM_MODELS: gemini-3.8-flash,haiku-5.5,gpt-6-luna
      LITELLM_DEFAULT_MODEL: openai/gemini-3.8-flash
      # chave para os MCPs da plataforma (o opencode lê via {env:LAP_API_KEY}; não vai para o opencode.json)
      LAP_BASE_URL: http://lap-web:4000
      LAP_API_KEY: ${LITELLM_MASTER_KEY}
    volumes:
      - opencode-data:/data
      - opencode-workspace:/tmp/opencode-workspace
    networks:
      aol-net: {aliases: [lap-opencode]}
    mem_limit: 1536m
    restart: unless-stopped
  # 2º OpenCode, só para os especialistas: o runtime recarrega o processo a cada sessão nova (para regravar os
  # MCPs), e um subagente no MESMO container derrubava a conversa do Orquestrador que o chamou.
  opencode-workers:
    profiles: ["opencode"]
    image: lap-opencode
    environment:
      LITELLM_BASE_URL: http://litellm:4000/v1
      LITELLM_API_KEY: ${AOL_LITELLM_KEY}
      LITELLM_PROVIDER_ID: openai
      LITELLM_MODELS: gemini-3.8-flash,haiku-5.5,gpt-6-luna
      LITELLM_DEFAULT_MODEL: openai/gemini-3.8-flash
      LAP_BASE_URL: http://lap-web:4000
      LAP_API_KEY: ${LITELLM_MASTER_KEY}
    volumes:
      - opencode-workers-data:/data
      - opencode-workers-workspace:/tmp/opencode-workspace
    networks:
      aol-net: {aliases: [lap-opencode-workers]}
    mem_limit: 1536m
    restart: unless-stopped
  register-opencode-workers:
    profiles: ["opencode"]
    image: curlimages/curl:8.11.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until curl -fsS http://lap-web:4000/health >/dev/null; do sleep 1; done
        until curl -fsS http://lap-opencode-workers:8080/health >/dev/null; do sleep 1; done
        body='{"alias":"aol-opencode-workers","api_spec":"claude_managed_agents","api_base":"http://lap-opencode-workers:8080","api_key":"opencode-local"}'
        curl -fsS -X POST http://lap-web:4000/api/runtime-harnesses -H "Authorization: Bearer $$LAP_MASTER_KEY" \
          -H "Content-Type: application/json" -d "$$body" \
        || curl -fsS -X PUT http://lap-web:4000/api/runtime-harnesses/aol-opencode-workers -H "Authorization: Bearer $$LAP_MASTER_KEY" \
          -H "Content-Type: application/json" -d '{"api_base":"http://lap-opencode-workers:8080","api_key":"opencode-local"}'
    environment:
      LAP_MASTER_KEY: ${LITELLM_MASTER_KEY}
    networks: [aol-net]
    depends_on: [lap, opencode-workers]
  register-opencode:
    environment:
      LAP_URL: http://lap-web:4000
      LAP_MASTER_KEY: ${LITELLM_MASTER_KEY}
      RUNTIME_ALIAS: aol-opencode
      RUNTIME_API_SPEC: claude_managed_agents
      RUNTIME_API_BASE: http://lap-opencode:8080
      RUNTIME_API_KEY: opencode-local
    networks: [aol-net]

  # Engenheiro Sênior: runtime OpenCode próprio (orçamento da key `pr-reviewer`, US$5/30d) + serviço que liga
  # o GitHub App ao agente. O workspace do runtime é compartilhado com o pr-reviewer, que faz o clone do PR
  # (o token do GitHub nunca entra no runtime do agente).
  opencode-reviewer:
    profiles: ["opencode"]
    image: lap-opencode
    environment:
      LITELLM_BASE_URL: http://litellm:4000/v1
      LITELLM_API_KEY: ${PR_REVIEWER_LITELLM_KEY}
      LITELLM_PROVIDER_ID: openai
      LITELLM_MODELS: gemini-3.8-flash,haiku-5.5,gpt-6-luna
      LITELLM_DEFAULT_MODEL: openai/gemini-3.8-flash
      # SEM chave do LAP: este agente lê código de terceiros (prompt injection). Só fala com o MCP do
      # pr-reviewer (token que só lista/lê/revisa PRs) e com o LiteLLM (key pr-reviewer, US$5/30d).
      PR_REVIEWER_MCP_TOKEN: ${PR_REVIEWER_MCP_TOKEN}
    volumes:
      - opencode-reviewer-data:/data
      - reviewer-workspace:/tmp/opencode-workspace
    networks:
      aol-net: {aliases: [lap-opencode-reviewer]}
    mem_limit: 1536m
    restart: unless-stopped
  register-opencode-reviewer:
    profiles: ["opencode"]
    image: curlimages/curl:8.11.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until curl -fsS http://lap-web:4000/health >/dev/null; do sleep 1; done
        until curl -fsS http://lap-opencode-reviewer:8080/health >/dev/null; do sleep 1; done
        body='{"alias":"aol-opencode-reviewer","api_spec":"claude_managed_agents","api_base":"http://lap-opencode-reviewer:8080","api_key":"opencode-local"}'
        curl -fsS -X POST http://lap-web:4000/api/runtime-harnesses -H "Authorization: Bearer $$LAP_MASTER_KEY" \
          -H "Content-Type: application/json" -d "$$body" \
        || curl -fsS -X PUT http://lap-web:4000/api/runtime-harnesses/aol-opencode-reviewer -H "Authorization: Bearer $$LAP_MASTER_KEY" \
          -H "Content-Type: application/json" -d '{"api_base":"http://lap-opencode-reviewer:8080","api_key":"opencode-local"}'
    environment:
      LAP_MASTER_KEY: ${LITELLM_MASTER_KEY}
    networks: [aol-net]
    depends_on: [lap, opencode-reviewer]
  pr-reviewer:
    profiles: ["opencode"]
    build: ./aol/pr-reviewer
    environment:
      GITHUB_ORG: aol-tech
      PUBLIC_URL: https://lap.aoltech.co
      SETUP_LOCAL_URL: http://localhost:4310
      LAP_URL: http://lap-web:4000
      LAP_API_KEY: ${LITELLM_MASTER_KEY}
      REVIEWER_AGENT_ID: ${REVIEWER_AGENT_ID:-}
      REVIEWER_RUNTIME: aol-opencode-reviewer
      PR_REVIEWER_MCP_TOKEN: ${PR_REVIEWER_MCP_TOKEN}
      LITELLM_URL: http://litellm:4000
      LITELLM_API_KEY: ${PR_REVIEWER_LITELLM_KEY}
      REVIEW_WORKSPACE: /workspace
      REVIEW_WORKSPACE_IN_AGENT: /tmp/opencode-workspace
    volumes:
      - ./aol/pr-reviewer/secrets:/secrets
      - reviewer-workspace:/workspace
    ports:
      - "127.0.0.1:4310:8080"   # /setup (criar o GitHub App) só pelo Mac
    networks:
      aol-net: {aliases: [lap-pr-reviewer]}
    mem_limit: 512m
    restart: unless-stopped

  # lap.aoltech.co → lap:4000 (túnel nomeado na conta Cloudflare da AOL Tech; credencial não versionada)
  tunnel:
    image: cloudflare/cloudflared:2025.8.1
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./aol/tunnel:/etc/cloudflared:ro
    depends_on: [lap]
    networks: [aol-net]
    restart: unless-stopped
    mem_limit: 128m

volumes:
  opencode-workspace:
  opencode-reviewer-data:
  reviewer-workspace:
  opencode-workers-data:
  opencode-workers-workspace:

networks:
  aol-net:
    external: true
